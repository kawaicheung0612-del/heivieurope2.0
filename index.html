        if (file.size > 4 * 1024 * 1024) {
          setSystemAlertMessage("⚠️ 檔案太大啦！為了保證手帳暢順儲存，請上傳小於 4MB 的圖片或 PDF 檔案喔。");
          return;
        }

        const reader = new FileReader();
        reader.onload = (event) => {
          if (file.type === 'application/pdf' || !file.type.startsWith('image/')) {
            callback(event.target.result);
            return;
          }
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 400;
            const scaleSize = MAX_WIDTH / img.width;
            canvas.width = MAX_WIDTH;
            canvas.height = img.height * scaleSize;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            callback(canvas.toDataURL('image/jpeg', 0.75));
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      };

          const amt = parseFloat(e.amount) || 0;
          const currency = e.currency || 'EUR';
          const payer = e.payer || 'Andrew';
          const splitType = e.splitType || 'shared';

          if (currency === 'EUR') eurTotal += amt;
          else if (currency === 'GBP') gbpTotal += amt;
          else hkdTotal += amt;

          if (splitLedger[currency]) {
            if (splitType === 'shared') {
              if (payer === 'Andrew') splitLedger[currency].andrewPaidShared += amt;
              else splitLedger[currency].vivianPaidShared += amt;
            } else {
              if (payer === 'Andrew') splitLedger[currency].andrewPaidPersonal += amt;
              else splitLedger[currency].vivianPaidPersonal += amt;
            }
          }
        });

        const convToHKD = (val, cur) => cur === 'EUR' ? val * 8.5 : cur === 'GBP' ? val * 10 : val;

        let totalAndrewPaidSharedInHKD = convToHKD(splitLedger.EUR.andrewPaidShared, 'EUR') + convToHKD(splitLedger.GBP.andrewPaidShared, 'GBP') + splitLedger.HKD.andrewPaidShared;
        let totalVivianPaidSharedInHKD = convToHKD(splitLedger.EUR.vivianPaidShared, 'EUR') + convToHKD(splitLedger.GBP.vivianPaidShared, 'GBP') + splitLedger.HKD.vivianPaidShared;
        let totalAndrewPersonalInHKD = convToHKD(splitLedger.EUR.andrewPaidPersonal, 'EUR') + convToHKD(splitLedger.GBP.andrewPaidPersonal, 'GBP') + splitLedger.HKD.andrewPaidPersonal;
        let totalVivianPersonalInHKD = convToHKD(splitLedger.EUR.vivianPaidPersonal, 'EUR') + convToHKD(splitLedger.GBP.vivianPaidPersonal, 'GBP') + splitLedger.HKD.vivianPaidPersonal;

        let netOwedHKD = 0; let whoOwesWhom = "";

                            <span className="text-[9px] font-mono text-white bg-[#8F9E8B] px-1.5 py-0.5 rounded-md font-bold mr-1.5">{sched.time}</span>
                            <span className="text-xs text-[#8E8774] font-mono">⏱ {sched.duration} 分鐘</span>
                            <h3 className="text-md font-bold text-[#3E4A3B] mt-1.5">{sched.name}</h3>
                          </div>
                          <div className="flex items-center gap-2">
                            <button onClick={() => openScheduleAddEdit(sched)} className="p-1 hover:bg-[#F4F1E9] rounded"><Icons.Edit /></button>
                            <button onClick={() => requestDelete('schedules', sched.id)} className="p-1 hover:bg-red-50 rounded"><Icons.Trash /></button>
                          </div>
                        </div>
                        {sched.address && (
                          <div className="mt-2 text-xs text-[#6F695B] bg-[#FCFAF2] border border-[#EBE7DD] rounded-lg p-2 flex items-center justify-between">
                            <span className="truncate pr-2 font-mono">📍 {sched.address}</span>
                            <button onClick={() => handleGoogleMapRedirect(sched.name, sched.address)} className="bg-white border text-[10px] px-2 py-1 rounded flex gap-1 font-bold"><Icons.Map />地圖</button>
                          </div>
                        )}
                        {sched.notes && <p className="mt-2 text-xs italic text-[#7C6A48] bg-[#E9DCA3]/20 border-l-4 border-[#E9DCA3] pl-2.5 py-1">✍️ {sched.notes}</p>}
                        {sched.ticketFileUrl && (
                          <div className="mt-2.5 pt-2 border-t border-dashed border-[#EAE6D9]">
                            <button onClick={() => handlePreviewAttachment(sched.ticketFileUrl, sched.name, false)} className="w-full text-xs font-bold text-[#8F9E8B] bg-[#F4F8F3] px-3 py-1.5 rounded-xl border border-[#8F9E8B]/30">🎟️ 點擊預覽門票憑證</button>
                          </div>
                        )}
                        <div className="mt-3 flex justify-between items-center">
                          <div className="flex gap-1">
                            <button disabled={idx===0} onClick={() => moveSchedule(idx, 'up')} className="p-1 border rounded bg-slate-50 text-xs disabled:opacity-30">🔼</button>
                            <button disabled={idx===arr.length-1} onClick={() => moveSchedule(idx, 'down')} className="p-1 border rounded bg-slate-50 text-xs disabled:opacity-30">🔽</button>
                          </div>
                          <div className="flex items-center gap-1 bg-[#F4F8F3] px-2.5 py-1 rounded-full text-[10px] text-[#5B6858] border border-[#8F9E8B]/20">
                            預估 {sched.transportTime} min 🚇
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* --- Bookings Tab --- */}
            {activeTab === 'bookings' && (
              <div className="space-y-3">
                <div className="flex justify-between items-center">
                  <h2 className="font-serif text-lg font-bold text-[#3E4A3B]">🎫 我的電子憑證</h2>
                  <button onClick={() => openBookingAddEdit()} className={`bg-[#8F9E8B] text-white py-1 px-3 rounded-full text-xs font-bold flex items-center gap-1 border-2 border-[#6F7F6C] shadow-sm ${styles.activeBtn}`}><Icons.Plus /> 新增憑證</button>
                </div>
                <div className="flex gap-1 overflow-x-auto pb-1.5 scrollbar-none">
                  {[{ id: 'flight', label: "✈️ 航班" }, { id: 'hotel', label: "🏨 住宿" }, { id: 'transit', label: "🚆 交通" }, { id: 'ticket', label: "🎫 門票" }].map(tab => (
                    <button key={tab.id} onClick={() => setBookingFilter(tab.id)} className={`text-xs px-3 py-1.5 rounded-xl border-2 font-bold ${bookingFilter === tab.id ? 'bg-[#8F9E8B] text-white border-[#6F7F6C]' : 'bg-white text-[#6F695B]'}`}>{tab.label}</button>
                  ))}
                </div>
                <div className="grid grid-cols-1 gap-4">
                  {bookings.filter(b => b.type === bookingFilter).map(book => (
                    <div key={book.id} className="bg-white border-2 border-[#8F9E8B] rounded-2xl overflow-hidden shadow-sm">
                      <div className="p-3 text-white font-bold flex justify-between bg-[#8F9E8B]">
                        <span className="text-xs">{book.title || book.flightNo}</span>
                        <div className="flex gap-1.5">
                          <button onClick={() => openBookingAddEdit(book)} className="text-xs bg-black/15 px-2 py-0.5 rounded">編輯</button>
                          <button onClick={() => requestDelete('bookings', book.id)} className="text-xs bg-red-800/20 px-2 py-0.5 rounded">刪除</button>
                        </div>
                      </div>
                      <div className="p-4 space-y-2 text-xs text-[#6F695B]">
                        <p>📅 日期: {book.date || book.checkInDate}</p>
                        <p>⏰ 時間: {book.time || book.checkInTime}</p>
                        {book.notes && <p className="italic bg-[#E9DCA3]/15 border-l-4 border-[#C88A58] pl-2 py-1">📝 {book.notes}</p>}
                        {book.fileUrl && (
                          <button onClick={() => handlePreviewAttachment(book.fileUrl, book.title, book.pinProtected)} className="w-full mt-2 font-bold px-3 py-1.5 rounded-xl border bg-[#F4F8F3] text-[#8F9E8B]">📄 點擊預覽檔案 {book.pinProtected && '🔐'}</button>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* --- Expenses Tab --- */}
            {activeTab === 'expenses' && (
              <div className="space-y-4">
                <div className="flex justify-between items-center">
                  <h2 className="font-serif text-lg font-bold text-[#3E4A3B]">💰 記帳簿</h2>
                  <button onClick={() => openExpenseAddEdit()} className={`bg-[#8F9E8B] text-white py-1 px-3 rounded-full text-xs font-bold flex items-center gap-1 border-2 border-[#6F7F6C] shadow-sm ${styles.activeBtn}`}><Icons.Plus /> 記一筆</button>
                </div>
                <div className="bg-[#8F9E8B] text-white rounded-2xl p-4 shadow-sm border-2 border-[#6F7F6C]">
                  <div className="flex justify-between text-[10px] pb-2 border-b border-[#AEC2AA]">
                    <span>預算 & 雙人拆帳看板</span> <span>總花費(HKD)</span>
                  </div>
                  <div className="text-2xl font-bold font-mono text-right mt-2 text-[#FFE993]">${getCurrencyTotals().TotalHKD}</div>
                  <div className="bg-[#FDFCF7] text-[#4A4435] rounded-xl p-3 mt-3 shadow-xs">
                    <div className="text-xs font-bold border-l-4 border-[#C88A58] pl-2">{getCurrencyTotals().whoOwesWhom}</div>
                  </div>
                </div>
                <div className="bg-white border-2 border-[#8F9E8B] rounded-2xl p-4">
                  {expenses.map(exp => (
                    <div key={exp.id} className="flex justify-between items-center text-xs py-2 border-b border-dashed">
                      <div>
                        <div className="font-bold text-[#3E4A3B]">{exp.desc}</div>
                        <div className="text-[9px] text-gray-500">{exp.date} · {exp.payer} 付</div>
                      </div>
                      <div className="flex items-center gap-2">
                        <span className="font-bold font-mono text-[#C88A58]">{exp.currency} {exp.amount}</span>
                        <button onClick={() => requestDelete('expenses', exp.id)} className="text-red-500"><Icons.Trash /></button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* --- Plannings Tab --- */}
            {activeTab === 'plannings' && (
              <div className="space-y-3">
                <div className="flex justify-between items-center">
                  <h2 className="font-serif text-lg font-bold text-[#3E4A3B]">📝 備忘與清單</h2>
                  <button onClick={() => openPlanningAddEdit()} className={`bg-[#8F9E8B] text-white py-1 px-3 rounded-full text-xs font-bold border-2 border-[#6F7F6C]`}><Icons.Plus /> 新增</button>
                </div>
                <div className="bg-[#FCFAF2] border-2 border-[#8F9E8B] rounded-2xl p-4">
                   {plannings.map(plan => (
                     <div key={plan.id} className="flex justify-between text-xs py-1.5">
                       <label className="flex items-center gap-2 cursor-pointer">
                         <input type="checkbox" checked={plan.done} onChange={() => saveData('planning', 'plannings', plan.id, { ...plan, done: !plan.done })} />
                         <span className={plan.done ? 'line-through text-gray-400' : ''}>{plan.text}</span>
                       </label>
                       <button onClick={() => requestDelete('plannings', plan.id)} className="text-red-500"><Icons.Trash /></button>
                     </div>
                   ))}
                </div>
              </div>
            )}

            {/* --- Culture Tab --- */}
            {activeTab === 'culture' && (
              <div className="space-y-4">
                <div className="bg-white border-2 border-[#8F9E8B] rounded-2xl p-4">
                   <h3 className="font-serif text-lg font-bold flex gap-1 mb-3"><Icons.Globe /> 文化禮儀</h3>
                   <div className="flex gap-2 overflow-x-auto pb-2 mb-2 scrollbar-none">
                     {Object.keys(countryGuides).map(code => (
                       <button key={code} onClick={() => setActiveLanguageTab(code)} className={`text-xs px-3 py-1.5 rounded-full border ${activeLanguageTab === code ? 'bg-[#8F9E8B] text-white' : 'bg-gray-50'}`}>{countryGuides[code].name.split(' ')[0]}</button>
                     ))}
                   </div>
                   <div className="bg-[#FCFAF2] p-4 rounded-xl text-xs space-y-2 leading-relaxed text-gray-700">
                     <p>{countryGuides[activeLanguageTab].food}</p>
                     <p>{countryGuides[activeLanguageTab].transit}</p>
                   </div>
                </div>
              </div>
            )}

            {/* --- Members Tab --- */}
            {activeTab === 'members' && (
              <div className="space-y-4">
                <div className="flex justify-between items-center">
                  <h2 className="font-serif text-lg font-bold">👥 旅伴成員</h2>
                  <button onClick={() => openMemberAddEdit()} className={`bg-[#8F9E8B] text-white py-1 px-3 rounded-full text-xs font-bold border-2 border-[#6F7F6C]`}><Icons.Plus /> 新增</button>
                </div>
                <div className="grid grid-cols-2 gap-3">
                  {members.map(member => (
                    <div key={member.id} className="bg-white border-2 border-[#8F9E8B] rounded-2xl p-4 text-center relative">
                      <button onClick={() => requestDelete('members', member.id)} className="absolute top-2 right-2 text-[10px] text-red-500">❌</button>
                      <img src={member.avatar} alt={member.name} className="w-16 h-16 rounded-full mx-auto bg-slate-50 border-2" />
                      <h3 className="text-sm font-bold mt-2">{member.name}</h3>
                    </div>
                  ))}
                </div>
              </div>
            )}

          </main>

          {/* 模態彈窗 */}
          {showScheduleModal && editingSchedule && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
              <div className="bg-white border-2 border-[#8F9E8B] rounded-2xl p-5 w-full max-w-sm">
                <h3 className="font-bold mb-3">📝 編輯行程手帳</h3>
                <input type="text" value={editingSchedule.name} onChange={e => setEditingSchedule({...editingSchedule, name: e.target.value})} className="w-full text-xs border rounded p-2 mb-2" placeholder="行程名稱" />
                <input type="time" value={editingSchedule.time} onChange={e => setEditingSchedule({...editingSchedule, time: e.target.value})} className="w-full text-xs border rounded p-2 mb-2" />
                <textarea rows="2" value={editingSchedule.notes} onChange={e => setEditingSchedule({...editingSchedule, notes: e.target.value})} className="w-full text-xs border rounded p-2 mb-2" placeholder="備註..." />
                <div className="flex gap-2 mt-2">
                  <button onClick={() => setShowScheduleModal(false)} className="flex-1 bg-gray-200 text-xs py-2 rounded-xl">取消</button>
                  <button onClick={handleSaveSchedule} className="flex-1 bg-[#8F9E8B] text-white text-xs py-2 rounded-xl">儲存</button>
                </div>
              </div>
            </div>
          )}

          {/* 密碼彈窗 */}
          {showPinModal && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl p-5 w-full max-w-xs text-center">
                <h3 className="font-bold mb-2">請輸入保險箱密碼</h3>
                <input type="password" value={tempPin} onChange={e => setTempPin(e.target.value)} className="w-full text-center tracking-widest border rounded p-2 mb-3" placeholder="4位數" />
                {pinError && <p className="text-xs text-red-500 mb-2">{pinError}</p>}
                <div className="flex gap-2"><button onClick={() => setShowPinModal(false)} className="flex-1 bg-gray-200 py-2 rounded text-xs">取消</button><button onClick={handleVerifyPin} className="flex-1 bg-[#8F9E8B] text-white py-2 rounded text-xs">解鎖</button></div>
              </div>
            </div>
          )}

          {/* 刪除確認 */}
          {deleteConfirm.show && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl p-5 w-full max-w-xs text-center">
                <h3 className="font-bold mb-2">確定要刪除這筆資料嗎？</h3>
                <div className="flex gap-2"><button onClick={() => setDeleteConfirm({show:false})} className="flex-1 bg-gray-200 py-2 rounded text-xs">取消</button><button onClick={confirmDelete} className="flex-1 bg-red-500 text-white py-2 rounded text-xs">刪除</button></div>
              </div>
            </div>
          )}

          {/* 系統提醒彈窗 */}
          {systemAlertMessage && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl p-5 w-full max-w-xs text-center">
                <span className="text-3xl">⚠️</span>
                <h3 className="font-bold mb-2 mt-2">系統提醒</h3>
                <p className="text-xs mb-4">{systemAlertMessage}</p>
                <button onClick={() => setSystemAlertMessage(null)} className="bg-[#8F9E8B] text-white py-2 px-6 rounded-xl text-xs">我知道了</button>
              </div>
            </div>
          )}

          {/* 預覽檔案 */}
          {previewFile.url && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl p-4 w-full max-w-md max-h-[80vh] flex flex-col">
                <div className="flex justify-between items-center mb-2"><h3 className="font-bold text-sm">預覽憑證</h3> <button onClick={() => setPreviewFile({url:null})} className="text-xl">✕</button></div>
                <div className="flex-1 overflow-auto bg-gray-100 rounded flex items-center justify-center p-2">
                  {previewFile.url.startsWith('data:image') ? <img src={previewFile.url} className="max-w-full rounded" /> : <a href={previewFile.url} download className="bg-[#8F9E8B] text-white px-4 py-2 rounded text-xs">下載 PDF 檔案</a>}
                </div>
              </div>
            </div>
          )}

          {/* 導航列 */}
          <div className="h-10"></div>
          <nav className="fixed bottom-0 left-0 right-0 w-full bg-[#FBF9F3] border-t-2 border-[#8F9E8B] z-40">
            <div className="max-w-md mx-auto px-2 py-2 flex items-center justify-around overflow-x-auto scrollbar-none gap-1">
              {[{ id: 'schedules', label: "行程", icon: Icons.Calendar }, { id: 'bookings', label: "預訂", icon: Icons.Ticket }, { id: 'expenses', label: "記帳", icon: Icons.Coins }, { id: 'plannings', label: "準備", icon: Icons.CheckList }, { id: 'culture', label: "文化", icon: Icons.Globe }, { id: 'members', label: "旅伴", icon: Icons.Users }].map(tab => {
                const IsActive = activeTab === tab.id;
                return (
                  <button key={tab.id} onClick={() => { setActiveTab(tab.id); window.scrollTo({top:0}); }} className={`flex flex-col items-center p-2 rounded-xl ${IsActive ? 'bg-[#8F9E8B] text-white' : 'text-[#8C8471]'}`}>
                    <tab.icon /><span className="text-[10px] font-bold mt-1">{tab.label}</span>
                  </button>
                );
              })}
            </div>
          </nav>
        </div>
      );
    }

    // 啟動 React
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
